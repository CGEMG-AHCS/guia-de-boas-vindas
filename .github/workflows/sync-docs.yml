name: Sync Docs

on:
  push:
    paths:
      - '**/*.md'
      - '*.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    # Evita loop quando o próprio workflow faz commit
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Identificar arquivos Markdown alterados
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD | grep '\.md$' > changed_files.txt || true

          echo "Arquivos alterados:"
          cat changed_files.txt || true

      - name: Atualizar docs
        run: |
          mkdir -p docs

          while read file; do

            # Ignora arquivos dentro de docs
            if [[ "$file" == docs/* ]]; then
              continue
            fi

            if [ -f "$file" ]; then
              mkdir -p "docs/$(dirname "$file")"
              cp "$file" "docs/$file"
              echo "Copiado: $file"
            fi

          done < changed_files.txt

      - name: Commit e Push
        run: |
          git add docs

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para enviar."
            exit 0
          fi

          git commit -m "Atualização automática da pasta docs"
          git push
